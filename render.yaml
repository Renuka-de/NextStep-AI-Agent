services:
  - type: web
    name: nextstep-ai
    runtime: python
    buildCommand: |
      pip install -r backend/requirements.txt
      cd client && npm ci && npm run build
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./nextstep.db
      - key: FRONTEND_URL
        fromService:
          type: web
          name: nextstep-ai
          property: host
    healthCheckPath: /api/health
    autoDeploy: true
